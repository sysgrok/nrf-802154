[package]
name = "nrf-802154-tests"
version = "0.1.0"
edition = "2021"
description = "The `cli_node` firmware node of `openthread`'s hardware-in-the-loop test tier, on the `nrf-802154` driver"
license = "MIT OR Apache-2.0"
publish = false

# The `openthread` repo's `tests/nrf` builds the same node on the `embassy-nrf`
# bare PHY plus the software MAC; this one puts the `nrf-802154` driver (full
# hardware MAC offload) underneath instead - no `MacRadio`, no `ProxyRadio`,
# no interrupt executor. The upstream harness over in the `openthread` repo
# drives whichever of the two is flashed (`cargo xtask itest --hw-port
# <board>=mcu ...`); it only ever talks to the board's console.

[[bin]]
name = "cli_node"
path = "src/bin/cli_node.rs"
harness = false

[features]
default = ["nrf52840"]
# Put the console on the board's own USB peripheral instead of a UART, for a
# board whose only serial port *is* USB - a XIAO nRF52840 plugged straight into
# the host, or an nRF52840 dongle. The default is a UART, which is what a board
# reached through a debug probe's UART bridge needs (and the only thing an
# nRF54L15 can offer, having no USB peripheral at all).
console-usb = ["dep:embassy-usb"]
# Which pins the UART console comes out on. The default is the nRF52840-DK's
# J-Link virtual COM port (P0.06 TX, P0.08 RX); `console-uart-xiao` selects a
# XIAO nRF52840's D6/D7 pads (P1.11 TX, P1.12 RX), which is what a XIAO wired
# to an external debug probe's UART bridge needs. Ignored under `console-usb`,
# and on nRF54L15, whose console pins are fixed by its onboard probe.
console-uart-xiao = []
nrf52840 = [
    "nrf-802154/nrf52840",
    "nrf-mpsl/nrf52840",
    "embassy-nrf/nrf52840",
    "embassy-nrf/time-driver-rtc1",
]
nrf54l15 = [
    "nrf-802154/nrf54l15-app-s",
    "nrf-mpsl/nrf54l15-app-s",
    "embassy-nrf/nrf54l15-app-s",
    "embassy-nrf/time-driver-grtc",
]

[dependencies]
nrf-802154 = { workspace = true, default-features = false, features = ["defmt", "openthread"] }
nrf-mpsl = { workspace = true, default-features = false, features = ["critical-section-impl"] }

# The same feature set the `openthread` repo's DUTs are built with, so the
# harness meets the same CLI surface on this tier too.
openthread = { workspace = true, default-features = false, features = [
    "defmt",
    "ftd",
    "cli",
    "mac-filter",
    "ping-sender",
    "slaac",
    "ecdsa",
    "dns-client",
    "srp-client",
    "commissioner",
    "joiner",
    "border-router",
    "netdiag-client",
    "reference-device",
    "srp-server",
    "dnssd-server",
    "service",
    "netdata-publisher",
    "coap",
    "coaps",
    "dataset-updater",
    "child-supervision",
    "history-tracker",
    "anycast-locator",
    "neighbor-discovery-agent",
    "ip6-fragmentation",
    "dhcp6-client",
    "dhcp6-server",
    "diagnostic",
] }

# Only the pure-Rust pieces the C CLI references - NOT `all`, which pulls
# tinyrlibc's vendored C printf and with it a C cross-compiler, for a
# `vsnprintf` nobody needs (the `openthread` build carries nanoprintf).
tinyrlibc = { workspace = true, default-features = false, features = [
    "alloc",
    "abs",
    "atoi",
    "isalpha",
    "isdigit",
    "isspace",
    "isupper",
    "itoa",
    "utoa",
    "memchr",
    "strcat",
    "strchr",
    "strcmp",
    "strcpy",
    "strcspn",
    "strlen",
    "strncasecmp",
    "strncmp",
    "strncpy",
    "strrchr",
    "strspn",
    "strstr",
    "strtol",
    "strtoul",
] }
embedded-alloc = { workspace = true }
embedded-storage-async = { workspace = true }

embassy-executor = { workspace = true, features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-nrf = { workspace = true, default-features = false, features = ["unstable-pac", "time"] }
embassy-sync = { workspace = true, features = ["defmt"] }
embassy-futures = { workspace = true }
embassy-time = { workspace = true, features = ["defmt"] }
embassy-usb = { workspace = true, features = ["defmt"], optional = true }

defmt = { workspace = true }
defmt-rtt = { workspace = true }

cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
panic-probe = { workspace = true, features = ["print-defmt"] }
static_cell = { workspace = true }
heapless = { workspace = true }
rand_core = { workspace = true }
critical-section = { workspace = true }
portable-atomic = { workspace = true, features = ["critical-section"] }
