[package]
name = "nrf-802154-examples"
version = "0.1.0"
edition = "2021"
description = "IEEE 802.15.4 examples for the nRF52840 and nRF54L15"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["nrf52840"]

nrf52840 = [
    "nrf-802154/nrf52840",
    "nrf-mpsl/nrf52840",
    "nrf-sdc/nrf52840",
    "embassy-nrf/nrf52840",
    "embassy-nrf/time-driver-rtc1",
]
nrf54l15 = [
    "_nrf54l",
    "nrf-802154/nrf54l15-app-s",
    "nrf-mpsl/nrf54l15-app-s",
    "nrf-sdc/nrf54l15-app-s",
    "embassy-nrf/nrf54l15-app-s",
    "embassy-nrf/time-driver-grtc",
]
nrf54lm20 = [
    "_nrf54l",
    "nrf-802154/nrf54lm20-app-s",
    "nrf-mpsl/nrf54lm20-app-s",
    "nrf-sdc/nrf54lm20-app-s",
    "embassy-nrf/nrf54lm20-app-s",
    "embassy-nrf/time-driver-grtc",
]

# The nRF54L15 and nRF54LM20 differ in nothing the examples care about: same
# interrupt names, same peripherals, same clock requirement.
_nrf54l = []

[[bin]]
name = "receive_frame"
path = "src/bin/receive_frame.rs"

[[bin]]
name = "receive_all_frames"
path = "src/bin/receive_all_frames.rs"

[[bin]]
name = "send_frame"
path = "src/bin/send_frame.rs"

[[bin]]
name = "send_broadcast_frame"
path = "src/bin/send_broadcast_frame.rs"

[[bin]]
name = "sniffer"
path = "src/bin/sniffer.rs"

[[bin]]
name = "basic_udp"
path = "src/bin/basic_udp.rs"
harness = false

[[bin]]
name = "basic_enet"
path = "src/bin/basic_enet.rs"
harness = false

[[bin]]
name = "srp"
path = "src/bin/srp.rs"
harness = false

# The BLE coexistence example is nRF52840-only for now: it pins a prebuilt
# SoftDevice Controller variant and a `trouble-host` configuration that have
# only been checked out on that part.
[[bin]]
name = "srp_ble_coex"
path = "src/bin/srp_ble_coex.rs"
harness = false
required-features = ["nrf52840"]

[dependencies]
nrf-802154 = { path = "../nrf-802154", version = "0.1", features = ["defmt", "openthread"] }
nrf-mpsl = { version = "0.3", features = ["critical-section-impl"] }
nrf-sdc = { version = "0.4", default-features = false, features = ["peripheral", "central", "defmt"] }
trouble-host = { version = "0.7", default-features = false, features = ["defmt", "gatt", "peripheral", "default-packet-pool"] }
bt-hci = { version = "0.9", features = ["defmt"] }

openthread = { version = "0.3", features = ["udp", "srp", "embassy-net-driver-channel", "defmt"] }
tinyrlibc = { version = "0.5", default-features = false, features = ["alloc", "strstr", "strcmp", "isupper", "utoa", "strtoul"] }
embedded-alloc = "0.7.0"

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-nrf = { version = "0.11", default-features = false, features = ["unstable-pac", "time"] }
embassy-sync = { version = "0.8", features = ["defmt"] }
embassy-futures = "0.1"
embassy-time = { version = "0.5", features = ["defmt"] }
embassy-net = { version = "0.8", features = ["defmt", "proto-ipv6", "medium-ip", "udp"] }

defmt = "1"
defmt-rtt = "1"

cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"
heapless = "0.8"
rand_core = "0.9"
