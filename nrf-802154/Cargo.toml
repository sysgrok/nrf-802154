[package]
name = "nrf-802154"
authors = ["Ivan Markov <ivan.markov@sysgrok.com>"]
version = "0.1.0"
edition = "2021"
description = "High level Rust bindings to the NRF 802.15.4 Radio Driver"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sysgrok/nrf-802154"
readme = "README.md"
keywords = ["nrf", "ieee802154", "thread", "embedded", "no-std"]
categories = ["embedded", "no-std", "hardware-support"]
rust-version = "1.93"

[package.metadata.docs.rs]
features = ["nrf52840"]
default-target = "thumbv7em-none-eabihf"
targets = ["thumbv7em-none-eabihf"]

[features]
#default = ["nrf52840", "defmt", "openthread"]
nrf52805 = ["nrf-mpsl/nrf52805", "nrf52", "embassy-nrf/nrf52805"]
nrf52810 = ["nrf-mpsl/nrf52810", "nrf52", "embassy-nrf/nrf52810"]
nrf52811 = ["nrf-mpsl/nrf52811", "nrf52", "embassy-nrf/nrf52811"]
nrf52820 = ["nrf-mpsl/nrf52820", "nrf52", "embassy-nrf/nrf52820"]
nrf52832 = ["nrf-mpsl/nrf52832", "nrf52", "embassy-nrf/nrf52832"]
nrf52833 = ["nrf-mpsl/nrf52833", "nrf52", "embassy-nrf/nrf52833"]
nrf52840 = ["nrf-mpsl/nrf52840", "nrf52", "embassy-nrf/nrf52840"]
nrf5340-net = ["nrf-mpsl/nrf5340-net", "nrf53", "embassy-nrf/nrf5340-net"]
nrf54l05-app-s = ["nrf-mpsl/nrf54l05-app-s", "nrf54l-s", "embassy-nrf/nrf54l05-app-s"]
nrf54l10-app-s = ["nrf-mpsl/nrf54l10-app-s", "nrf54l-s", "embassy-nrf/nrf54l10-app-s"]
nrf54l10-app-ns = ["nrf-mpsl/nrf54l10-app-ns", "nrf54l-ns", "embassy-nrf/nrf54l10-app-ns"]
nrf54l15-app-s = ["nrf-mpsl/nrf54l15-app-s", "nrf54l-s", "embassy-nrf/nrf54l15-app-s"]
nrf54l15-app-ns = ["nrf-mpsl/nrf54l15-app-ns", "nrf54l-ns", "embassy-nrf/nrf54l15-app-ns"]
# nRF54LM20: secure only, matching `nrf-mpsl` and `embassy-nrf`.
nrf54lm20-app-s = ["nrf-mpsl/nrf54lm20-app-s", "nrf54lm20-s", "embassy-nrf/nrf54lm20-app-s"]

nrf52 = ["nrf-802154-sys/nrf52"]
nrf53 = ["nrf-802154-sys/nrf53"]
# The prebuilt SL libraries are byte-identical across the whole nRF54L family
# (only the secure/non-secure split matters), so a single pair of series-level
# features covers nRF54L05/L10/L15. The nRF54LM20 still needs its own, because
# the C driver is compiled against a chip define and that part moves `CCM00`.
nrf54l-s = ["nrf-802154-sys/nrf54l-s", "_nrf54l"]
nrf54l-ns = ["nrf-802154-sys/nrf54l-ns", "_nrf54l"]
nrf54lm20-s = ["nrf-802154-sys/nrf54lm20-s", "_nrf54l"]
_nrf54l = []

defmt = ["dep:defmt", "nrf-mpsl/defmt"]
log = ["dep:log", "nrf-mpsl/log"]

[dependencies]
defmt = { version = "1", optional = true }
log = { version = "0.4", optional = true }
openthread = { version = "0.3", optional = true }
nrf-mpsl = "0.3"
nrf-802154-sys = { version = "0.1", path = "../nrf-802154-sys" }
embassy-nrf = { version = "0.11", features = ["unstable-pac"] }
embassy-sync = "0.8"
critical-section = "1.2"
cortex-m = "0.7"
